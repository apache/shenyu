apiVersion: v1
kind: Namespace
metadata:
  name: shenyu-gateway-api
---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: shenyu-gateway-api-controller
  namespace: shenyu-gateway-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shenyu-gateway-api-controller
  namespace: shenyu-gateway-api
  labels:
    app: shenyu-gateway-api-controller
    all: shenyu-gateway-api-controller
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shenyu-gateway-api-controller
  template:
    metadata:
      labels:
        app: shenyu-gateway-api-controller
    spec:
      containers:
      - name: shenyu-gateway-api-controller
        image: apache/shenyu-integrated-test-k8s-gateway-api-http:latest
        ports:
        - containerPort: 9195
        env:
          - name: KUBECONFIG
            value: '/root/.kube/config'
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9195
          initialDelaySeconds: 10
          periodSeconds: 3
          failureThreshold: 40
        imagePullPolicy: IfNotPresent
      serviceAccountName: shenyu-gateway-api-controller
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shenyu-gateway-api-controller
  namespace: shenyu-gateway-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: shenyu-gateway-api-controller
---
apiVersion: v1
kind: Service
metadata:
  name: shenyu-gateway-api-controller
  namespace: shenyu-gateway-api
spec:
  selector:
    app: shenyu-gateway-api-controller
  type: NodePort
  ports:
    - port: 9195
      targetPort: 9195
      nodePort: 30095
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shenyu-gateway-api-controller
rules:
# The controllers watch Endpoints (sharing name/namespace with the backed Service)
# to resolve backendRefs; no Service, Secret or Pod objects are accessed.
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  - gatewayclasses/status
  - gateways
  - gateways/status
  - httproutes
  - httproutes/status
  verbs:
  - get
  - list
  - watch
  - update
  - patch
# Required for cross-namespace parentRef validation via ReferenceGrant
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - referencegrants
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shenyu-gateway-api-controller
  namespace: shenyu-gateway-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shenyu-gateway-api-controller
subjects:
- kind: ServiceAccount
  name: shenyu-gateway-api-controller
  namespace: shenyu-gateway-api
