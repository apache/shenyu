version: "3.9"
services:

  shenyu-admin:
    image: apache/shenyu-admin:latest
    container_name: shenyu-admin
    restart: always
    networks:
      - shenyu
    ports:
      - "9095:9095"
    environment:
      - SPRING_PROFILES_ACTIVE=h2
      - shenyu.sync.websocket.token=shenyu-sync-token
      - shenyu.database.init_script=sql-script/h2/schema.sql
      - shenyu.jwt.secretKey=shenyu-e2e-jwt-secret-key-2024
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://shenyu-admin:9095/actuator/health | grep UP || exit 1"]
      timeout: 2s
      retries: 30
      start_period: 5s

  websocket-fixture:
    image: shenyu-websocket-test-fixture:local
    build:
      context: ../../shenyu-e2e/shenyu-e2e-case/compose/fixtures/websocket
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8868/actuator/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      - shenyu


  shenyu-integrated-test-websocket:
    container_name: shenyu-integrated-test-websocket
    image: apache/shenyu-integrated-test-websocket:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 2048M
    environment:
      - shenyu.sync.websocket.urls=ws://shenyu-admin:9095/websocket
      - shenyu.sync.websocket.token=shenyu-sync-token
    depends_on:
      shenyu-admin:
        condition: service_healthy
    ports:
      - "9195:9195"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://shenyu-integrated-test-websocket:9195/actuator/health" ]
      timeout: 2s
      retries: 3
      start_period: 5s
    networks:
      - shenyu

networks:
  shenyu:
    name: shenyu
