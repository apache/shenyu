apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-smoke-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http-smoke-fixture
  template:
    metadata:
      labels:
        app: http-smoke-fixture
    spec:
      containers:
        - name: httpbin
          image: python:3.12-alpine
          command: ["python", "-B", "-u", "/opt/fixture/httpbin.py"]
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /status/200
              port: 80
          volumeMounts:
            - name: source
              mountPath: /opt/fixture
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: http-smoke-fixture

---
apiVersion: v1
kind: Service
metadata:
  name: http-smoke-fixture
spec:
  type: NodePort
  selector:
    app: http-smoke-fixture
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31189
