services:
  httpbin:
    image: python:3.12-alpine
    command: ["python", "-B", "-u", "/opt/httpbin.py"]
    volumes:
      - ./httpbin.py:/opt/httpbin.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/anything', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
    networks:
      shenyu:
        # Existing routing scenarios resolve their upstream on this test network.
        aliases:
          - httpbin.org
