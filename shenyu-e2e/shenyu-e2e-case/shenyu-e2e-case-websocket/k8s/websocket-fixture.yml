apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-fixture
  template:
    metadata:
      labels:
        app: websocket-fixture
    spec:
      containers:
        - name: websocket-fixture
          image: shenyu-websocket-test-fixture:local
          imagePullPolicy: Never
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: websocket
          ports:
            - name: websocket
              containerPort: 8868

---
apiVersion: v1
kind: Service
metadata:
  name: websocket-fixture
spec:
  selector:
    app: websocket-fixture
  ports:
    - name: websocket
      port: 8868
      targetPort: websocket
