management:
  health:
    redis:
      enabled: false
    elasticsearch:
      enabled: false
  endpoint:
    health:
      enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include:
          - 'health'
          - 'info'
shenyu:
  namespace: 649330b6-c2d7-4edc-be8e-8a54df9eb385
  selectorMatchCache:
    ## selector match cache
    cache:
      enabled: false
      initialCapacity: 10000 # initial capacity in cache
      maximumSize: 10000 # max size in cache
      ttl: 60000 # milliseconds after write; shorter TTL reduces stale reuse but increases matching work
  ruleMatchCache:
    ## rule match cache
    cache:
      enabled: false
      initialCapacity: 10000 # initial capacity in cache
      maximumSize: 65536 # max size in cache
      ttl: 60000 # milliseconds after write; applies to positive and negative matches
  netty:
    http:
      # set to false, user can custom the netty tcp server config.
      webServerFactoryEnabled: true
      selectCount: 1
      workerCount: 8
      accessLog: false
      # Optional HTTP listener alongside server.ssl or SNI HTTPS; shares the gateway handler without redirecting.
      # additionalHttpPort: 9196
      serverSocketChannel:
        soBackLog: 128
        soReuseAddr: true
        connectTimeoutMillis: 10000
        writeBufferHighWaterMark: 65536
        writeBufferLowWaterMark: 32768
        writeSpinCount: 16
        autoRead: false
        allocType: "unpooled"
        messageSizeEstimator: 8
        singleEventExecutorPerGroup: true
      socketChannel:
        soKeepAlive: false
        soReuseAddr: true
        soLinger: -1
        tcpNoDelay: true
        ipTos: 0
        allowHalfClosure: false
        connectTimeoutMillis: 10000
        writeBufferHighWaterMark: 65536
        writeBufferLowWaterMark: 32768
        writeSpinCount: 16
        autoRead: false
        allocType: "unpooled"
        messageSizeEstimator: 8
        singleEventExecutorPerGroup: true
      sni:
        enabled: false
        mod: k8s #manul
        defaultK8sSecretNamespace: shenyu-ingress
        defaultK8sSecretName: default-cert
#        mod: manual
#        certificates:
#          - domain: 'localhost'
#            keyCertChainFile: '/Users/zhukunshuai/Desktop/cert/example.com+1.pem'
#            keyFile: '/Users/zhukunshuai/Desktop/cert/example.com+1-key.pem'
#          - domain: 'example.com'
#            keyCertChainFile: '/Users/zhukunshuai/Desktop/cert/example.com+1.pem'
#            keyFile: '/Users/zhukunshuai/Desktop/cert/example.com+1-key.pem'
      httpDecoder:
        maxInitialLineLength: 4096
        maxHeaderSize: 8192
        maxChunkSize: 8192
#  httpclient:
#    strategy: netty # webClient
#    connectTimeout: 45000
#    responseTimeout: 3000
#    readerIdleTime: 3000
#    writerIdleTime: 3000
#    allIdleTime: 3000
#    readTimeout: 3000
#    writeTimeout: 3000
#    wiretap: false
#    keepAlive: false
#    maxInMemorySize: 1 #1mb
#    pool:
#      type: FIXED
#      name: shenyu-proxy
#      maxConnections: 500
#      acquireTimeout: 3000
#      maxPendingAcquires: 1000 # default is 2 * maxConnections if omitted
#      maxIdleTime: 3000 # unit: ms
