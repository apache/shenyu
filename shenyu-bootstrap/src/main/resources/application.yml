  heartbeat:
    enabled: true
    serverLists: http://localhost:9095
    props:
      username: admin
      password: 123456
  exclude:
    enabled: false
    paths:
      - /favicon.ico
  fallback:
    enabled: false
    paths:
      - /fallback/resilience4j
      - /fallback/sentinel
  health:
    enabled: true
    paths:
      - /actuator
      - /health_check
  alert:
    enabled: false
    admins: localhost:9095
  extPlugin:
    path:
    enabled: true
    threads: 1
    scheduleTime: 300
    scheduleDelay: 30
  scheduler:
    enabled: false
    type: fixed
    threads: 16
  upstreamCheck:
    enabled: false
    poolSize: 10
    timeout: 3000
    healthyThreshold: 1
    unhealthyThreshold: 1
    interval: 5000
    printEnabled: true
    printInterval: 60000
  springCloudCache:
    enabled: false
  ribbon:
    serverListRefreshInterval: 10000
  metrics:
    enabled: false
    name : prometheus
    host: 127.0.0.1
    port: 8090
    jmxConfig:
    props:
      jvm_enabled: true
  tracing:
    enabled: false
    serviceName: shenyu-gateway
    createSpan: true
    # parent_based continues the decision of the client and samples a request which has none,
    # always_on and always_off decide about every request, even about the request of a client which
    # has decided already, and ratio continues the decision of the client as well while it samples a
    # request which carries no parent context with the given ratio
