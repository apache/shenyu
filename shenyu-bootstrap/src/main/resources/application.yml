  register:
    enabled: false
    registerType: zookeeper #etcd #consul
    serverLists: localhost:2181 #http://localhost:2379 #localhost:8848
    props:
  cross:
    enabled: true
    allowedHeaders:
    allowedMethods: "*"
    allowedAnyOrigin: true # the same of Access-Control-Allow-Origin: "*"
#    allowedOrigin:
      # format : schema://prefix spacer domain
      # Access-Control-Allow-Origin: "http://a.apache.org,http://b.apache.org"
#      spacer: "."
#      domain: apache.org
#      prefixes:
#        - a # a.apache.org
#        - b # b.apache.org
#      origins:
#        - c.apache.org
#        - d.apache.org
#        - http://e.apache.org
#      originRegex: ^http(|s)://(.*\.|)abc.com$
    allowedExpose: ""
    maxAge: "18000"
    allowCredentials: true

  switchConfig:
    local: true
    collapseSlashes: false
  file:
    enabled: true
    maxSize : 10
  # Standalone file mode (opt-in): see shenyu-spring-boot-starter-sync-data-file/README.md.
  # It suppresses the shipped Admin WebSocket/heartbeat defaults and disables local writers.
  # sync.file.enabled: true
  # sync.file.path: /etc/shenyu/gateway.yaml
  sync:
    websocket:
      urls: ws://localhost:9095/websocket
      token: ${SHENYU_SYNC_WEBSOCKET_TOKEN:}
      allowOrigin: ws://localhost:9195
      # Advertised cluster master origins trusted besides the configured seed origins.
      # Entries: host, host:port, or ws(s)://host:port. A host without a port trusts any port.
      trusted-master-hosts:
      # Explicitly allow a wss connection to follow a plaintext ws advertised master.
      allow-insecure-master-redirect: false
