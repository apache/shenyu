version: 1
plugins:
  - name: global
    enabled: true
    config: {}
  - name: divide
    enabled: true
    config: {}
  - name: uri
    enabled: true
    config: {}
  - name: nettyHttpClient
    enabled: true
    config: {}
  - name: response
    enabled: true
    config: {}
  - name: contextPath
    enabled: false
    config: {}
selectors:
  - id: http-api
    plugin: divide
    name: HTTP API
    sort: 0
    conditions:
      - paramType: uri
        operator: match
        paramValue: /api/**
rules:
  - id: http-api-route
    selector: http-api
    sort: 0
    conditions:
      - paramType: uri
        operator: match
        paramValue: /api/**
    handle:
      loadBalance: roundRobin
      retry: 0
      timeout: 3000
upstreams:
  - selector: http-api
    targets:
      - url: ${UPSTREAM_ORIGIN:http://127.0.0.1:8080}
        weight: 100
metadata: []
auth: []
