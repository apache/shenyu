name: Close

# Post /close as the entire comment on an open PR. The PR author and users
# with write, maintain, or admin access may close it. A rocket confirms success.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  close:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/close')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: close-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Use the default-branch script without checking out or executing PR code.
      - name: Close pull request
        uses: actions/github-script@v7
        with:
          script: |
            const {issue, comment, action} = context.payload;
            if (action !== 'created' || !issue?.pull_request || comment?.body?.trim() !== '/close') {
                return;
            }

            const repo = context.repo;
            const pullRequest = {...repo, pull_number: issue.number};
            const {data: pr} = await github.rest.pulls.get(pullRequest);
            if (pr.state !== 'open') {
                core.info('Skipping a closed pull request.');
                return;
            }

            if (comment.user.login.toLowerCase() !== pr.user.login.toLowerCase()) {
                const {data: access} = await github.rest.repos.getCollaboratorPermissionLevel({
                    ...repo,
                    username: comment.user.login,
                });
                if (!['write', 'maintain', 'admin'].includes(access.permission)) {
                    core.info('Only the pull request author or a user with write access can close it.');
                    return;
                }
            }

            await github.rest.pulls.update({...pullRequest, state: 'closed'});
            await github.rest.reactions.createForIssueComment({
                ...repo,
                comment_id: comment.id,
                content: 'rocket',
            });
