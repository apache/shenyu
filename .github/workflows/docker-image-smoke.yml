name: docker-image-smoke

# Path-filtered on purpose: this is a distribution smoke test, not part of the
# main build. While the `pull_request.paths` filter is present, do not add this
# workflow to the required-status-check list (a docs-only PR would never report a
# result and would stay blocked); remove the filter first if it must be required.
on:
  pull_request:
    paths:
      - 'shenyu-dist/**/docker/**'
      - 'shenyu-dist/**/src/main/assembly/**'
      - 'Makefile'
      - 'script/docker-image-smoke.sh'
      - 'docs/container-runtime.md'
      - '.github/workflows/docker-image-smoke.yml'
      - '!*.md'
      - '!**/README*.md'
      - '!docs/**'
      - '!**/docs/**'
  push:
    branches:
      - master
    paths:
      - 'shenyu-dist/**/docker/**'
      - 'shenyu-dist/**/src/main/assembly/**'
      - 'Makefile'
      - 'script/docker-image-smoke.sh'
      - 'docs/container-runtime.md'
      - '.github/workflows/docker-image-smoke.yml'
      - '!*.md'
      - '!**/README*.md'
      - '!docs/**'
      - '!**/docs/**'

permissions:
  contents: read

concurrency:
  # Give every non-PR run its own group, including runs still waiting for a runner.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.repository == 'apache/shenyu'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run container runtime smoke checks
        run: bash script/docker-image-smoke.sh
