name: Pull Request Comment Commands

# Commands are parsed one per line, so a comment may contain prose and several
# commands, for example /retest followed by /hold.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  execute:
    if: >-
      github.event.issue.pull_request &&
      (contains(github.event.comment.body, '/assign') ||
      contains(github.event.comment.body, '/unassign') ||
      contains(github.event.comment.body, '/cc') ||
      contains(github.event.comment.body, '/uncc') ||
      contains(github.event.comment.body, '/lgtm') ||
      contains(github.event.comment.body, '/unlgtm') ||
      contains(github.event.comment.body, '/hold') ||
      contains(github.event.comment.body, '/unhold') ||
      contains(github.event.comment.body, '/close') ||
      contains(github.event.comment.body, '/reopen') ||
      contains(github.event.comment.body, '/retest'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    concurrency:
      group: pr-comment-commands-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Check out the default branch command handler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Execute pull request comment commands
        uses: actions/github-script@v7
        with:
          script: |
            const {run} = require('./.github/scripts/pr-comment-commands.cjs');
            await run({context, github, core});
