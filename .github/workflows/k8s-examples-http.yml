name: k8s-examples-http

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '**/README*.md'
      - 'docs/**'
      - '**/docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  # Give every non-PR run its own group, including runs still waiting for a runner.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  k8s-examples-http:
    runs-on: ubuntu-latest
    if: (github.repository == 'apache/shenyu')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Test conditional disk cleanup
        run: bash .github/scripts/free-disk-space-test.sh
      - name: Test k3s installation retries
        run: bash .github/scripts/install-k3s-test.sh
      - uses: ./actions/paths-filter
        id: filter
        with:
          list-files: "json"
          predicate-quantifier: every
          filters: |
            k8s-examples:
              - '{shenyu-examples/**,shenyu-*/**,pom.xml,**/pom.xml,.github/workflows/k8s-examples-http.yml,.github/scripts/**,actions/**}'
              - '!.asf.yaml'
              - '!.gitignore'
              - '!.licenserc.yaml'
              - '!LICENSE'
              - '!NOTICE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!*.md'
              - '!**/README*.md'
              - '!docs/**'
              - '!**/docs/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
      - name: Resolve k8s example cases
        id: cases
        if: steps.filter.outputs['k8s-examples'] == 'true'
        env:
          CHANGED_FILES_JSON: ${{ steps.filter.outputs['k8s-examples_files'] }}
          CI_CASE_MODE: k8s-examples-http
        run: bash .github/scripts/resolve-test-case-matrix.sh
      - name: Free disk space when needed
        if: steps.cases.outputs.run_k8s_examples == 'true'
        run: bash .github/scripts/free-disk-space.sh
      - name: Install k8s
        if: steps.cases.outputs.run_k8s_examples == 'true'
        run: bash .github/scripts/install-k3s.sh
      - name: Setup Java and Maven cache
        if: steps.cases.outputs.run_k8s_examples == 'true'
        uses: ./actions/setup-java-with-retry
        with:
          java-version: 17
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: |
            **/pom.xml
      - name: Build with Maven
        if: steps.cases.outputs.run_k8s_examples == 'true'
        shell: bash
        run: |
          ./mvnw -B -T 1C clean install -Prelease,docker -Dmaven.javadoc.skip=true -Dmaven.test.skip=true
      - name: Build examples
        if: steps.cases.outputs.run_k8s_examples == 'true'
        shell: bash
        run: |
          ./mvnw -B -T 1C clean install -Pexample -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -pl :shenyu-examples-http -am -f ./shenyu-examples/pom.xml
      - name: Build k8s Cluster
        if: steps.cases.outputs.run_k8s_examples == 'true'
        run: |
          docker save apache/shenyu-admin:latest apache/shenyu-bootstrap:latest shenyu-examples-http:latest | sudo k3s ctr images import -
          kubectl apply -f ./shenyu-examples/shenyu-examples-http/k8s/shenyu-deployment.yml
          kubectl apply -f ./shenyu-examples/shenyu-examples-http/k8s/shenyu-service.yml
          kubectl apply -f ./shenyu-examples/shenyu-examples-http/k8s/shenyu-zookeeper.yml
          kubectl apply -f ./shenyu-examples/shenyu-examples-http/k8s/shenyu-examples-http.yml
      - name: Wait for k8s Cluster Start up
        if: steps.cases.outputs.run_k8s_examples == 'true'
        run: |
          bash ./shenyu-examples/shenyu-examples-http/k8s/script/healthcheck.sh
      - name: Cluster Test after Healthcheck
        if: steps.cases.outputs.run_k8s_examples == 'true'
        run: |
          kubectl get all
          kubectl get events --all-namespaces
          kubectl logs -l all=shenyu-examples-http
