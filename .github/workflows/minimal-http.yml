name: minimal-http
on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'shenyu-bootstrap-http/**'
      - 'shenyu-common/**'
      - 'shenyu-admin/**'
      - 'shenyu-admin-listener/**'
      - 'shenyu-dist/**'
      - 'shenyu-web/**'
      - 'shenyu-plugin/**'
      - 'shenyu-spring-boot-starter/**'
      - 'shenyu-sync-data-center/**'
      - 'shenyu-loadbalancer/**'
      - 'shenyu-spi/**'
      - 'script/performance/minimal-http/**'
      - '.github/workflows/minimal-http.yml'
      - '.github/scripts/resolve-ci-modules.sh'
      - '.github/scripts/test-minimal-http-routing.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packaged-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve archive version
        id: version
        run: echo "version=$(./mvnw -q -N -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"
      - name: Build opt-in assembly with Checkstyle and RAT
        run: |
          bash .github/scripts/test-minimal-http-routing.sh
          ./mvnw -B -Pminimal-http -pl shenyu-bootstrap-http -am clean install -DskipTests -Dmaven.javadoc.skip=true -Djacoco.skip=true
      - name: Record resolved runtime dependencies
        run: ./mvnw -B -Pminimal-http -pl shenyu-bootstrap-http dependency:list -DincludeScope=runtime -DoutputFile=target/runtime-dependencies.txt
      - name: Check harness and packaged routing
        env:
          SHENYU_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install -r script/performance/minimal-http/requirements.txt
          python -m unittest discover -s script/performance/minimal-http -p 'test_*.py'
          python script/performance/minimal-http/benchmark.py \
            --minimal "shenyu-bootstrap-http/target/apache-shenyu-http-${SHENYU_VERSION}-bin/apache-shenyu-http" \
            --java "$JAVA_HOME/bin/java" --smoke-only \
            --output shenyu-bootstrap-http/target/smoke
      - name: Build disposable Admin and test real centrally synchronized routes
        env:
          SHENYU_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./mvnw -B -Prelease -pl shenyu-dist/shenyu-admin-dist -am package -DskipTests -Dmaven.javadoc.skip=true -Djacoco.skip=true
          tar -xzf "shenyu-dist/shenyu-admin-dist/target/apache-shenyu-${SHENYU_VERSION}-admin-bin.tar.gz" -C shenyu-dist/shenyu-admin-dist/target
          python script/performance/minimal-http/admin_smoke.py \
            --admin "shenyu-dist/shenyu-admin-dist/target/apache-shenyu-${SHENYU_VERSION}-admin-bin" \
            --minimal "shenyu-bootstrap-http/target/apache-shenyu-http-${SHENYU_VERSION}-bin/apache-shenyu-http" \
            --java "$JAVA_HOME/bin/java" --output shenyu-bootstrap-http/target/admin-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimal-http-package-and-smoke
          path: |
            shenyu-bootstrap-http/target/*-bin.tar.gz
            shenyu-bootstrap-http/target/runtime-dependencies.txt
            shenyu-bootstrap-http/target/smoke/
            shenyu-bootstrap-http/target/admin-smoke/
