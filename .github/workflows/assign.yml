name: Assign

# Post /assign or /assign @user1 @user2 as the entire comment on an open PR.
# With no arguments, assign the commenter. A rocket confirms success.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  assign:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/assign')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: assign-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Use the default-branch script without checking out or executing PR code.
      - name: Assign pull request
        uses: actions/github-script@v7
        with:
          script: |
            const {issue, comment, action} = context.payload;
            const command = comment?.body?.trim().match(/^\/assign(?:[ \t]+(@?[a-zA-Z0-9-]+(?:[ \t]+@?[a-zA-Z0-9-]+)*))?$/);
            if (action !== 'created' || !issue?.pull_request || !command) {
                return;
            }

            const repo = context.repo;
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: issue.number});
            if (pr.state !== 'open') {
                core.info('Skipping a closed pull request.');
                return;
            }

            const users = command[1] ? command[1].split(/[ \t]+/) : [comment.user.login];
            const assignees = [...new Set(users.map(user => user.replace(/^@/, '').toLowerCase()))];
            if (assignees.length > 10) {
                core.setFailed('A pull request can have at most 10 assignees.');
                return;
            }

            const {data: updated} = await github.rest.issues.addAssignees({
                ...repo,
                issue_number: issue.number,
                assignees,
            });
            // GitHub silently ignores users who cannot be assigned; report partial failures.
            const assigned = new Set(updated.assignees.map(user => user.login.toLowerCase()));
            const missing = assignees.filter(user => !assigned.has(user));
            if (missing.length) {
                core.setFailed(`Could not assign: ${missing.join(', ')}.`);
                return;
            }

            await github.rest.reactions.createForIssueComment({
                ...repo,
                comment_id: comment.id,
                content: 'rocket',
            });
