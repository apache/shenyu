name: it

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.ico'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - 'LICENSE'
      - 'NOTICE'
      - 'DISCLAIMER'
      - '.asf.yaml'
      - '.gitignore'
      - '.licenserc.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE'
      - '**/resources/static/**'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.ico'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - 'LICENSE'
      - 'NOTICE'
      - 'DISCLAIMER'
      - '.asf.yaml'
      - '.gitignore'
      - '.licenserc.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE'
      - '**/resources/static/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.repository == 'apache/shenyu'
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
      run_integration: ${{ steps.cases.outputs.run_integration }}
      integration_matrix: ${{ steps.cases.outputs.integration_matrix }}
    steps:
      - uses: actions/checkout@v3
      - name: Test integrated-test example project mapping
        run: bash .github/scripts/resolve-it-example-projects-test.sh
      - uses: ./actions/paths-filter
        id: filter
        with:
          list-files: "json"
          filters: |
            integration:
              - 'shenyu-integrated-test/**'
              - 'shenyu-*/**'
              - 'db/**'
              - 'pom.xml'
              - '**/pom.xml'
              - 'shenyu-examples/**'
              - '!**/*.md'
              - '!**/*.txt'
              - '!resources/static/**'
              - '!.asf.yaml'
              - '!.gitignore'
              - '!.licenserc.yaml'
              - '!LICENSE'
              - '!NOTICE'
              - '!.github/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE'
              - '.github/workflows/integrated-test.yml'
              - '.github/scripts/resolve-it-example-projects*.sh'
      - name: Resolve integrated test cases
        id: cases
        if: steps.filter.outputs.integration == 'true'
        env:
          CHANGED_FILES_JSON: ${{ steps.filter.outputs.integration_files }}
          CI_CASE_MODE: integration
        run: bash .github/scripts/resolve-test-case-matrix.sh

  prepare:
    needs: changes
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && needs.changes.outputs.run_integration == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Free disk space
        run: |
          df --human-readable
          sudo apt clean
          for image in $(docker image ls --all --quiet); do
            docker rmi $image
          done
          rm --recursive --force "$AGENT_TOOLSDIRECTORY"
          df --human-readable
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: 17
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: |
            **/pom.xml
      - name: Install mvnd
        shell: bash
        run: |
          MVND_VERSION=1.0.6
          curl -sfL https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip -o mvnd.zip
          unzip -q mvnd.zip
          mkdir -p $HOME/.local
          mv maven-mvnd-${MVND_VERSION}-linux-amd64 $HOME/.local/mvnd
          echo "$HOME/.local/mvnd/bin" >> $GITHUB_PATH
          echo "MVND_HOME=$HOME/.local/mvnd" >> $GITHUB_ENV
      - name: Pre-pull docker base images
        shell: bash
        run: |
          pull_with_retry() {
            local image="$1"
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                return 0
              fi
              echo "docker pull $image failed on attempt $attempt"
              sleep $((attempt * 10))
            done
            docker pull "$image"
          }

          pull_with_retry alpine:latest
          pull_with_retry amazoncorretto:17.0.11-alpine3.19
          pull_with_retry centos:7
          pull_with_retry eclipse-temurin:17-centos7
      - name: Build ShenYu with Maven
        shell: bash
        run: |
          if mvnd --version > /dev/null 2>&1; then
            echo "Using mvnd for build"
            mvnd -B -T 1C clean install -Prelease,docker -Dmaven.javadoc.skip=true -Dmaven.test.skip=true
          else
            echo "Falling back to maven wrapper"
            ./mvnw -B -T 1C clean install -Prelease,docker -Dmaven.javadoc.skip=true -Dmaven.test.skip=true
          fi
      - name: Stage ShenYu admin image
        run: docker save apache/shenyu-admin:latest > /tmp/apache-shenyu-admin.tar
      - name: Upload ShenYu admin image
        uses: actions/upload-artifact@v4
        with:
          name: shenyu-it-base-image
          path: /tmp/apache-shenyu-admin.tar
          retention-days: 1
          compression-level: 0
      - name: Stage ShenYu local Maven repository
        run: |
          mkdir -p /tmp/shenyu-m2/org/apache
          cp -R "${HOME}/.m2/repository/org/apache/shenyu" /tmp/shenyu-m2/org/apache/shenyu
      - name: Upload ShenYu local Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: shenyu-it-local-maven-repository
          path: /tmp/shenyu-m2
          retention-days: 1

  build:
    needs:
      - changes
      - prepare
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.integration_matrix || '{"include":[]}') }}
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && needs.changes.outputs.run_integration == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      # Copied from https://github.com/jens-maus/RaspberryMatic/blob/ea6b8ce0dd2d53ea88b2766ba8d7f8e1d667281f/.github/workflows/ci.yml#L34-L40
      # and https://github.com/actions/virtual-environments/issues/709#issuecomment-612569242
      - name: Free disk space
        run: |
          df --human-readable
          sudo apt clean
          for image in $(docker image ls --all --quiet); do
            docker rmi $image
          done
          rm --recursive --force "$AGENT_TOOLSDIRECTORY"
          df --human-readable
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: 17
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: |
            **/pom.xml
      - name: Install mvnd
        shell: bash
        run: |
          MVND_VERSION=1.0.6
          curl -sfL https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip -o mvnd.zip
          unzip -q mvnd.zip
          mkdir -p $HOME/.local
          mv maven-mvnd-${MVND_VERSION}-linux-amd64 $HOME/.local/mvnd
          echo "$HOME/.local/mvnd/bin" >> $GITHUB_PATH
          echo "MVND_HOME=$HOME/.local/mvnd" >> $GITHUB_ENV
      - name: Pre-pull docker base images
        shell: bash
        run: |
          pull_with_retry() {
            local image="$1"
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                return 0
              fi
              echo "docker pull $image failed on attempt $attempt"
              sleep $((attempt * 10))
            done
            docker pull "$image"
          }

          pull_with_retry alpine:latest
          pull_with_retry amazoncorretto:17.0.11-alpine3.19
          pull_with_retry centos:7
          pull_with_retry eclipse-temurin:17-centos7
      - uses: actions/download-artifact@v4
        with:
          name: shenyu-it-base-image
          path: /tmp/shenyu
      - name: Load ShenYu admin image
        run: docker load --input /tmp/shenyu/apache-shenyu-admin.tar
      - uses: actions/download-artifact@v4
        with:
          name: shenyu-it-local-maven-repository
          path: /tmp/shenyu-m2
      - name: Restore ShenYu local Maven repository
        run: bash .github/scripts/restore-shenyu-local-repo.sh /tmp/shenyu-m2
      - name: Build case examples
        shell: bash
        run: |
          EXAMPLE_PROJECTS="$(bash .github/scripts/resolve-it-example-projects.sh "${{ matrix.case }}")"
          if mvnd --version > /dev/null 2>&1; then
            echo "Using mvnd to build ${EXAMPLE_PROJECTS}"
            mvnd -B -T 1C clean install -Pexample -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -pl "${EXAMPLE_PROJECTS}" -am -f ./shenyu-examples/pom.xml
          else
            echo "Falling back to maven wrapper to build ${EXAMPLE_PROJECTS}"
            ./mvnw -B -T 1C clean install -Pexample -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -pl "${EXAMPLE_PROJECTS}" -am -f ./shenyu-examples/pom.xml
          fi
      - name: Build integrated-test case
        shell: bash
        run: |
          if mvnd --version > /dev/null 2>&1; then
            echo "Using mvnd to build ${{ matrix.case }}"
            mvnd -B -T 1C clean install -Pit -DskipTests -pl ":${{ matrix.case }}" -am -f ./shenyu-integrated-test/pom.xml
          else
            echo "Falling back to maven wrapper to build ${{ matrix.case }}"
            ./mvnw -B -T 1C clean install -Pit -DskipTests -pl ":${{ matrix.case }}" -am -f ./shenyu-integrated-test/pom.xml
          fi
      - name: Start docker compose
        run: docker compose -f ./shenyu-integrated-test/${{ matrix.case }}/docker-compose.yml up -d
      - name: Wait for docker compose start up completely
        run: bash ./shenyu-integrated-test/${{ matrix.case }}/script/healthcheck.sh
      - name: Disk space info
        run: |
          df --human-readable
      - name: Run test
        id: test
        shell: bash
        run: |
          if mvnd --version > /dev/null 2>&1; then
            echo "Using mvnd for running tests"
            mvnd -T 1C test -Pit -f ./shenyu-integrated-test/${{ matrix.case }}/pom.xml
          else
            echo "Falling back to maven wrapper for tests"
            ./mvnw -T 1C test -Pit -f ./shenyu-integrated-test/${{ matrix.case }}/pom.xml
          fi
        continue-on-error: true
      - name: Check test result
        run: |
          docker compose -f ./shenyu-integrated-test/${{ matrix.case }}/docker-compose.yml logs --tail="all"
          if [[ ${{steps.test.outcome}} == "failure" ]]; then
            echo "Test Failed"
            exit 1
          else
            echo "Test Successful"
            exit 0
          fi
