name: it

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.ico'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - 'LICENSE'
      - 'NOTICE'
      - 'DISCLAIMER'
      - '.asf.yaml'
      - '.gitignore'
      - '.licenserc.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE'
      - '**/resources/static/**'
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.ico'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - 'LICENSE'
      - 'NOTICE'
      - 'DISCLAIMER'
      - '.asf.yaml'
      - '.gitignore'
      - '.licenserc.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE'
      - '**/resources/static/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.repository == 'apache/shenyu'
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
      run_integration: ${{ steps.cases.outputs.run_integration }}
      integration_matrix: ${{ steps.cases.outputs.integration_matrix }}
    steps:
      - uses: actions/checkout@v3
      - uses: ./actions/paths-filter
        id: filter
        with:
          list-files: "json"
          filters: |
            integration:
              - 'shenyu-integrated-test/**'
              - 'shenyu-*/**'
              - 'db/**'
              - 'pom.xml'
              - '**/pom.xml'
              - 'shenyu-examples/**'
              - '!**/*.md'
              - '!**/*.txt'
              - '!resources/static/**'
              - '!.asf.yaml'
              - '!.gitignore'
              - '!.licenserc.yaml'
              - '!LICENSE'
              - '!NOTICE'
              - '!.github/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE'
      - name: Resolve integrated test cases
        id: cases
        if: steps.filter.outputs.integration == 'true'
        env:
          CHANGED_FILES_JSON: ${{ steps.filter.outputs.integration_files }}
          CI_CASE_MODE: integration
        run: bash .github/scripts/resolve-test-case-matrix.sh

  build:
    needs: changes
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.integration_matrix || '{"include":[]}') }}
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && needs.changes.outputs.run_integration == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      # Copied from https://github.com/jens-maus/RaspberryMatic/blob/ea6b8ce0dd2d53ea88b2766ba8d7f8e1d667281f/.github/workflows/ci.yml#L34-L40
      # and https://github.com/actions/virtual-environments/issues/709#issuecomment-612569242
      - name: Free disk space
        run: |
          df --human-readable
          sudo apt clean
          for image in $(docker image ls --all --quiet); do
            docker rmi $image
          done
          rm --recursive --force "$AGENT_TOOLSDIRECTORY"
          df --human-readable
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: 17
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: |
            **/pom.xml
      - name: Install mvnd
        shell: bash
        run: |
          MVND_VERSION=1.0.6
          curl -sfL https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip -o mvnd.zip
          unzip -q mvnd.zip
          mkdir -p $HOME/.local
          mv maven-mvnd-${MVND_VERSION}-linux-amd64 $HOME/.local/mvnd
          echo "$HOME/.local/mvnd/bin" >> $GITHUB_PATH
          echo "MVND_HOME=$HOME/.local/mvnd" >> $GITHUB_ENV
      - name: Ensure Maven wrapper JAR
        shell: bash
        run: |
          wrapper_jar=.mvn/wrapper/maven-wrapper.jar
          wrapper_main=org/apache/maven/wrapper/MavenWrapperMain.class
          if [[ -r "$wrapper_jar" ]] && jar tf "$wrapper_jar" | grep -Fx "$wrapper_main" > /dev/null; then
            exit 0
          fi

          wrapper_url="$(awk -F= '$1 == "wrapperUrl" { print substr($0, index($0, "=") + 1); exit }' .mvn/wrapper/maven-wrapper.properties)"
          if [[ -z "$wrapper_url" ]]; then
            echo "Could not find wrapperUrl in .mvn/wrapper/maven-wrapper.properties."
            exit 1
          fi

          wrapper_tmp="$(mktemp .mvn/wrapper/maven-wrapper.jar.XXXXXX)"
          trap 'rm -f "$wrapper_tmp"' EXIT
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$wrapper_tmp" "$wrapper_url"
          if ! jar tf "$wrapper_tmp" | grep -Fx "$wrapper_main" > /dev/null; then
            echo "Downloaded Maven wrapper JAR does not contain $wrapper_main."
            exit 1
          fi
          mv "$wrapper_tmp" "$wrapper_jar"
      - name: Pre-pull docker base images
        shell: bash
        run: |
          pull_with_retry() {
            local image="$1"
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                return 0
              fi
              echo "docker pull $image failed on attempt $attempt"
              sleep $((attempt * 10))
            done
            docker pull "$image"
          }

          pull_with_retry alpine:3.24
          pull_with_retry amazoncorretto:17.0.21-alpine3.24
          pull_with_retry amazoncorretto:17.0.11-alpine3.19
          pull_with_retry eclipse-temurin:17-centos7
          pull_with_retry elasticsearch:8.2.3
          pull_with_retry otel/opentelemetry-collector-contrib:0.111.0
      - name: Build with Maven
        shell: bash
        run: |
          if mvnd --version > /dev/null 2>&1; then
            echo "Using mvnd for build"
            exec bash .github/scripts/maven-with-retry.sh mvnd -B -T 1C clean install -Prelease,docker -Dmaven.javadoc.skip=true -Dmaven.test.skip=true
          else
            echo "Falling back to maven wrapper"
            exec bash .github/scripts/maven-with-retry.sh ./mvnw -B -T 1C clean install -Prelease,docker -Dmaven.javadoc.skip=true -Dmaven.test.skip=true
          fi
      - name: Build examples
        shell: bash
        run: |
          if mvnd --version > /dev/null 2>&1; then
            echo "Using mvnd for build examples"
            exec bash .github/scripts/maven-with-retry.sh mvnd -B -T 1C clean install -Pexample -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -am -f ./shenyu-examples/pom.xml
          else
            echo "Falling back to maven wrapper for examples"
            exec bash .github/scripts/maven-with-retry.sh ./mvnw -B -T 1C clean install -Pexample -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -am -f ./shenyu-examples/pom.xml
          fi
      - name: Build integrated tests
        shell: bash
        # mvnd can report success while skipping this entire subreactor.
        run: |
          exec bash .github/scripts/maven-with-retry.sh ./mvnw -B -ntp -T 1C clean install -Pit -Dmaven.test.skip=true \
            -pl :${{ matrix.case }} -am -f ./shenyu-integrated-test/pom.xml
      - name: Verify integrated test image
        run: docker image inspect apache/${{ matrix.case }}:latest --format '{{.Id}}'
      - name: Start docker compose
        run: |
          if ! docker compose -f ./shenyu-integrated-test/${{ matrix.case }}/docker-compose.yml up -d; then
            docker compose -f ./shenyu-integrated-test/${{ matrix.case }}/docker-compose.yml ps --all || true
            docker compose -f ./shenyu-integrated-test/${{ matrix.case }}/docker-compose.yml logs --no-color --tail=200 || true
            exit 1
          fi
      - name: Wait for docker compose start up completely
        run: bash ./shenyu-integrated-test/${{ matrix.case }}/script/healthcheck.sh
      - name: Disk space info
        run: |
          df --human-readable
      - name: Run test
        id: test
        shell: bash
        run: |
          exec bash .github/scripts/maven-with-retry.sh ./mvnw -B -ntp -T 1C test -Pit -DfailIfNoTests=true \
            -f ./shenyu-integrated-test/${{ matrix.case }}/pom.xml
        continue-on-error: true
      - name: Retry combination tests after a transient gRPC bind conflict
        id: retry-combination
        if: steps.test.outcome == 'failure' && matrix.case == 'shenyu-integrated-test-combination'
        shell: bash
        run: |
          compose_file="./shenyu-integrated-test/${{ matrix.case }}/docker-compose.yml"
          if ! docker compose -f "$compose_file" logs shenyu-examples-grpc 2>&1 | grep -Fq 'bind(..) failed: Address already in use'; then
            echo "No transient gRPC bind conflict was recorded; keeping the original test failure."
            exit 1
          fi

          docker compose -f "$compose_file" restart shenyu-examples-grpc
          for attempt in $(seq 1 30); do
            if docker compose -f "$compose_file" logs shenyu-examples-grpc 2>&1 | grep -Fq 'Grpc server started successfully'; then
              break
            fi
            sleep 2
          done
          if ! docker compose -f "$compose_file" logs shenyu-examples-grpc 2>&1 | grep -Fq 'Grpc server started successfully'; then
            echo "The gRPC example did not start after restarting its container."
            exit 1
          fi

          exec bash .github/scripts/maven-with-retry.sh ./mvnw -B -ntp -T 1C test -Pit -DfailIfNoTests=true \
            -f ./shenyu-integrated-test/${{ matrix.case }}/pom.xml
      - name: Check test result
        run: |
          docker compose -f ./shenyu-integrated-test/${{ matrix.case }}/docker-compose.yml logs --tail="all"
          if [[ ${{steps.test.outcome}} == "failure" && ${{steps.retry-combination.outcome}} != "success" ]]; then
            echo "Test Failed"
            exit 1
          else
            echo "Test Successful"
            exit 0
          fi
