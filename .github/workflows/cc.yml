name: CC

# Post /cc @user1 @user2 as the entire comment on an open PR to mention users.
# Usernames may omit @ and are deduplicated. A rocket confirms success.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cc:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/cc')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: cc-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Use the default-branch script without checking out or executing PR code.
      - name: Mention users on pull request
        uses: actions/github-script@v7
        with:
          script: |
            const {issue, comment, action} = context.payload;
            const command = comment?.body?.trim().match(/^\/cc[ \t]+(@?[a-zA-Z0-9-]+(?:[ \t]+@?[a-zA-Z0-9-]+)*)$/);
            if (action !== 'created' || !issue?.pull_request || !command) {
                return;
            }

            const repo = context.repo;
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: issue.number});
            if (pr.state !== 'open') {
                core.info('Skipping a closed pull request.');
                return;
            }

            const users = [...new Set(command[1].split(/[ \t]+/).map(user => user.replace(/^@/, '').toLowerCase()))];
            await github.rest.issues.createComment({
                ...repo,
                issue_number: issue.number,
                body: `cc: ${users.map(user => `@${user}`).join(' ')}`,
            });
            await github.rest.reactions.createForIssueComment({
                ...repo,
                comment_id: comment.id,
                content: 'rocket',
            });
