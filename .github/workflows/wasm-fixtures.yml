name: wasm-fixtures

on:
  pull_request:
    paths:
      - 'shenyu-plugin/shenyu-plugin-wasm-api/**'
      - 'shenyu-plugin/shenyu-plugin-wasm-base/**'
      - '.github/scripts/verify-wasm-fixtures.py'
      - '.github/scripts/test-wasm-fixtures.py'
      - '.github/workflows/wasm-fixtures.yml'
      - 'pom.xml'
  push:
    branches: [master]
    paths:
      - 'shenyu-plugin/shenyu-plugin-wasm-api/**'
      - 'shenyu-plugin/shenyu-plugin-wasm-base/**'
      - '.github/scripts/verify-wasm-fixtures.py'
      - '.github/scripts/test-wasm-fixtures.py'
      - '.github/workflows/wasm-fixtures.yml'
      - 'pom.xml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rebuild-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3
      - name: Test fixture verification failures and resource restoration
        run: python3 .github/scripts/test-wasm-fixtures.py
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install pinned WABT
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/WebAssembly/wabt/releases/download/1.0.42/wabt-1.0.42-linux-x64.tar.gz \
            --output "${RUNNER_TEMP}/wabt.tar.gz"
          echo "84895407a6bbb80e918f33b16b2fb2206021c150b6bc9ff6f761263a745ab131  ${RUNNER_TEMP}/wabt.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/wabt.tar.gz" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/wabt-1.0.42/bin" >> "${GITHUB_PATH}"
      - name: Install pinned Rust and WASI target
        run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-wasip1
      - name: Check WAT binaries and test rebuilt Rust guests
        run: python3 .github/scripts/verify-wasm-fixtures.py
