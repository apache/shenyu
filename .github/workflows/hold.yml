name: Hold

# Post /hold as the entire comment on an open PR to add the hold label.
# This label alone does not block merging. A rocket confirms success.
# Use the existing /unhold command to remove the label.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  hold:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/hold')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: hold-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Use the default-branch script without checking out or executing PR code.
      - name: Hold pull request
        uses: actions/github-script@v7
        with:
          script: |
            const {issue, comment, action} = context.payload;
            if (action !== 'created' || !issue?.pull_request || comment?.body?.trim() !== '/hold') {
                return;
            }

            const repo = context.repo;
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: issue.number});
            if (pr.state !== 'open') {
                core.info('Skipping a closed pull request.');
                return;
            }

            await github.rest.issues.addLabels({
                ...repo,
                issue_number: issue.number,
                labels: ['hold'],
            });
            await github.rest.reactions.createForIssueComment({
                ...repo,
                comment_id: comment.id,
                content: 'rocket',
            });
