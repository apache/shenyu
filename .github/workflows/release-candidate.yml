name: release-candidate

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Release branch or tag containing the prepared non-SNAPSHOT POM
        required: true
        type: string
      release_version:
        description: Maven release version, for example 2.7.2
        required: true
        type: string
      candidate:
        description: Candidate label, for example RC4
        required: true
        type: string
      nexus_profile_id:
        description: Sonatype staging profile ID for Apache ShenYu
        required: true
        default: 711e5cf06a7654
        type: string
      gpg_key_id:
        description: Full fingerprint of the Apache signing key
        required: true
        default: 4EBB813D10EEDB27D8D891AF5E300845B5CFD2A7
        type: string
      push_signed_tag:
        description: Create and push the signed v<version>-<candidate> tag
        required: true
        default: true
        type: boolean

concurrency:
  # Manual dispatches for one version/candidate must share a group. The fallback
  # keeps the repository-wide workflow assertion valid for non-dispatch events.
  group: release-candidate-${{ inputs.release_version || github.event.pull_request.number || github.run_id }}-${{ inputs.candidate || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: write
  contents: write

jobs:
  stage:
    if: github.repository == 'apache/shenyu'
    runs-on: ubuntu-latest
    environment: apache-release-candidate
    timeout-minutes: 180
    outputs:
      ci_run_id: ${{ steps.ci.outputs.run_id }}
      maven_staging_id: ${{ steps.publish.outputs.maven_staging_id }}
      maven_staging_url: ${{ steps.publish.outputs.maven_staging_url }}
      svn_url: ${{ steps.publish.outputs.svn_url }}
      svn_revision: ${{ steps.publish.outputs.svn_revision }}
      signed_tag: ${{ steps.publish.outputs.signed_tag }}
    env:
      RELEASE_REF: ${{ inputs.release_ref }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      CANDIDATE: ${{ inputs.candidate }}
      NEXUS_PROFILE_ID: ${{ inputs.nexus_profile_id }}
      GPG_KEY_ID: ${{ inputs.gpg_key_id }}

    steps:
      - name: Check out the release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          submodules: true

      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^[0-9]+\.[0-9]+\.[0-9]+-release$ ]] || {
            echo "release_ref must be a protected <version>-release branch" >&2
            exit 1
          }
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_VERSION" != *SNAPSHOT* ]] || {
            echo "release_version must not contain SNAPSHOT" >&2
            exit 1
          }
          [[ "$CANDIDATE" =~ ^RC[0-9]+$ ]]
          branch_name="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${RELEASE_REF}" --jq .name)"
          [[ "$branch_name" == "$RELEASE_REF" ]] || {
            echo "release_ref must resolve to an existing remote branch" >&2
            exit 1
          }
          branch_protected="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${RELEASE_REF}" --jq .protected)"
          [[ "$branch_protected" == "true" ]] || {
            echo "release_ref must be a GitHub-protected branch" >&2
            exit 1
          }
          branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${RELEASE_REF}" --jq .commit.sha)"
          remote_sha="$(git ls-remote origin "refs/heads/${RELEASE_REF}" | awk '{print $1}')"
          [[ -n "$remote_sha" && "$remote_sha" == "$branch_sha" && "$remote_sha" == "$(git rev-parse HEAD)" ]] || {
            echo "Checked out release ref does not match the explicit refs/heads/${RELEASE_REF} branch" >&2
            exit 1
          }
          environment_rules="$(gh api "repos/${GITHUB_REPOSITORY}/environments/apache-release-candidate" \
            --jq '[.protection_rules[] | select(.type == "required_reviewers" and (.reviewers | length > 0))] | length' 2>/dev/null || true)"
          [[ "$environment_rules" =~ ^[1-9][0-9]*$ ]] || {
            echo "Configure at least one required_reviewers rule with reviewers for the apache-release-candidate environment before staging" >&2
            exit 1
          }
          version="$(python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          print(ET.parse('pom.xml').getroot().findtext('{http://maven.apache.org/POM/4.0.0}version') or '')
          PYTHON
          )"
          [[ "$version" == "$RELEASE_VERSION" && "$version" != *SNAPSHOT* ]] || {
            echo "pom.xml contains $version, expected non-SNAPSHOT $RELEASE_VERSION" >&2
            exit 1
          }
          if git ls-remote --exit-code origin "refs/tags/v${RELEASE_VERSION}-${CANDIDATE}" >/dev/null 2>&1; then
            echo "Candidate tag already exists: v${RELEASE_VERSION}-${CANDIDATE}" >&2
            exit 1
          fi
          svn_url="https://dist.apache.org/repos/dist/dev/shenyu/${RELEASE_VERSION}-${CANDIDATE}"
          svn_error="$RUNNER_TEMP/svn-existing-check.log"
          if svn info "$svn_url" > /dev/null 2>"$svn_error"; then
            echo "Candidate SVN directory already exists: $svn_url" >&2
            exit 1
          fi
          if ! grep -Eq 'E160013|E170013|404|not found|Not Found' "$svn_error"; then
            echo "Could not prove that the candidate SVN directory is absent:" >&2
            cat "$svn_error" >&2
            exit 1
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Trigger the full release-candidate CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          dispatch_id="$(uuidgen | tr '[:upper:]' '[:lower:]')"
          echo "dispatch_id=$dispatch_id" >> "$GITHUB_OUTPUT"
          gh workflow run ci.yml --ref "$RELEASE_REF" \
            -f release_candidate=true -f release_dispatch_id="$dispatch_id"
          run_id=""
          for attempt in {1..60}; do
            run_id="$(gh run list --workflow ci.yml --event workflow_dispatch --limit 20 \
              --json databaseId,headSha,createdAt,displayTitle | \
              python3 -c 'import json, sys; sha, started, dispatch = sys.argv[1:]; runs = json.load(sys.stdin); title = f"Release candidate {dispatch}"; matches = [r for r in runs if r.get("headSha") == sha and r.get("createdAt", "") >= started and r.get("displayTitle") == title]; print(matches[0]["databaseId"] if matches else "")' \
              "$release_sha" "$started_at" "$dispatch_id")"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          [[ -n "$run_id" ]] || { echo 'Timed out waiting for release CI dispatch' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status
          conclusion="$(gh run view "$run_id" --json conclusion --jq .conclusion)"
          [[ "$conclusion" == success ]] || { echo "Release CI concluded $conclusion" >&2; exit 1; }

      - name: Download the validated Maven repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maven-artifact"
          gh run download "${{ steps.ci.outputs.run_id }}" \
            --name shenyu-local-maven-repository \
            --dir "$RUNNER_TEMP/maven-artifact"
          mkdir -p "$RUNNER_TEMP/maven-repository"
          tar -xzf "$RUNNER_TEMP/maven-artifact/repository.tar.gz" \
            -C "$RUNNER_TEMP/maven-repository"
          test -d "$RUNNER_TEMP/maven-repository/org/apache/shenyu"

      - name: Import the Apache signing key
        env:
          APACHE_GPG_PRIVATE_KEY: ${{ secrets.APACHE_GPG_PRIVATE_KEY }}
          APACHE_GPG_PASSPHRASE: ${{ secrets.APACHE_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 -p "$GNUPGHOME"
          printf '%s' "$APACHE_GPG_PRIVATE_KEY" | gpg --batch --import
          passphrase_file="$RUNNER_TEMP/gpg-passphrase"
          umask 077
          printf '%s' "$APACHE_GPG_PASSPHRASE" > "$passphrase_file"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV"

      - name: Sign Maven artifacts and prepare SVN distributions
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-release-candidate.py \
            --repository "$RUNNER_TEMP/maven-repository/org/apache/shenyu" \
            --staging-repository "$RUNNER_TEMP/maven-staging-repository/org/apache/shenyu" \
            --version "$RELEASE_VERSION" \
            --svn-dir "$RUNNER_TEMP/svn" \
            --key-id "$GPG_KEY_ID" \
            --passphrase-file "$GPG_PASSPHRASE_FILE" \
            --manifest "$RUNNER_TEMP/release-manifest.json"

      - name: Create the Nexus settings file
        shell: bash
        env:
          NEXUS_USER: ${{ secrets.APACHE_LDAP_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.APACHE_LDAP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/settings.xml" <<'PYTHON'
          import os
          import sys
          from xml.sax.saxutils import escape
          path = sys.argv[1]
          user = escape(os.environ['NEXUS_USER'])
          password = escape(os.environ['NEXUS_PASSWORD'])
          open(path, 'w', encoding='utf-8').write(f'''<settings>
            <servers><server><id>apache.releases.https</id><username>{user}</username><password>{password}</password></server></servers>
          </settings>\n''')
          PYTHON
          chmod 600 "$RUNNER_TEMP/settings.xml"

      - name: Upload and close the Maven staging repository
        id: nexus
        env:
          MAVEN_OPTS: --add-opens=java.base/java.util=ALL-UNNAMED
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/nexus-staging.log"
          ./mvnw -B -ntp -N -s "$RUNNER_TEMP/settings.xml" \
            org.sonatype.plugins:nexus-staging-maven-plugin:1.6.13:deploy-staged-repository \
            -DserverId=apache.releases.https \
            -DnexusUrl=https://repository.apache.org/ \
            -DstagingProfileId="$NEXUS_PROFILE_ID" \
            -DrepositoryDirectory="$RUNNER_TEMP/maven-staging-repository" \
            -DskipStagingRepositoryClose=true \
            -DautoReleaseAfterClose=false \
            -DkeepStagingRepositoryOnFailure=true \
            "-DstagingDescription=Apache ShenYu ${RELEASE_VERSION} ${CANDIDATE} ${release_sha}" 2>&1 | tee "$log"
          staging_id="$(grep -oE 'orgapacheshenyu-[0-9]+' "$log" | tail -1)"
          [[ -n "$staging_id" ]] || { echo 'Could not determine the Nexus staging repository ID' >&2; exit 1; }
          ./mvnw -B -ntp -N -s "$RUNNER_TEMP/settings.xml" \
            org.sonatype.plugins:nexus-staging-maven-plugin:1.6.13:rc-close \
            -DserverId=apache.releases.https \
            -DnexusUrl=https://repository.apache.org/ \
            -DstagingRepositoryId="$staging_id" \
            -DkeepStagingRepositoryOnCloseRuleFailure=true \
            -DautoReleaseAfterClose=false
          echo "staging_id=$staging_id" >> "$GITHUB_OUTPUT"

      - name: Publish the candidate to Apache SVN dev
        id: svn
        env:
          APACHE_LDAP_USERNAME: ${{ secrets.APACHE_LDAP_USERNAME }}
          APACHE_LDAP_PASSWORD: ${{ secrets.APACHE_LDAP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          svn_url="https://dist.apache.org/repos/dist/dev/shenyu/${RELEASE_VERSION}-${CANDIDATE}"
          svn_log="$RUNNER_TEMP/svn-import.log"
          svn import "$RUNNER_TEMP/svn" "$svn_url" \
            --username "$APACHE_LDAP_USERNAME" --password "$APACHE_LDAP_PASSWORD" \
            --non-interactive --trust-server-cert \
            -m "Stage Apache ShenYu ${RELEASE_VERSION} ${CANDIDATE}" 2>&1 | tee "$svn_log"
          revision="$(grep -oE 'Committed revision [0-9]+' "$svn_log" | awk '{print $3}' | tail -1)"
          [[ -n "$revision" ]] || { echo 'Could not determine the SVN revision' >&2; exit 1; }
          echo "svn_url=$svn_url" >> "$GITHUB_OUTPUT"
          echo "svn_revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Create and push the signed candidate tag
        id: tag
        if: inputs.push_signed_tag
        shell: bash
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/gpg-wrapper.sh"
          cat > "$wrapper" <<'SH'
          #!/bin/sh
          exec gpg --batch --pinentry-mode loopback --passphrase-file "$GPG_PASSPHRASE_FILE" "$@"
          SH
          chmod 700 "$wrapper"
          git config gpg.program "$wrapper"
          git config user.name "Apache ShenYu Release Bot"
          git config user.email "dev"@"shenyu.apache.org"
          tag="v${RELEASE_VERSION}-${CANDIDATE}"
          git tag -s -u "$GPG_KEY_ID" -m "Apache ShenYu ${RELEASE_VERSION} ${CANDIDATE}" "$tag"
          git verify-tag "$tag"
          git push origin "$tag"
          echo "signed_tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release coordinates
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          staging_id="${{ steps.nexus.outputs.staging_id }}"
          svn_url="${{ steps.svn.outputs.svn_url }}"
          svn_revision="${{ steps.svn.outputs.svn_revision }}"
          signed_tag="${{ steps.tag.outputs.signed_tag }}"
          staging_url="https://repository.apache.org/content/repositories/${staging_id}/"
          echo "maven_staging_id=$staging_id" >> "$GITHUB_OUTPUT"
          echo "maven_staging_url=$staging_url" >> "$GITHUB_OUTPUT"
          echo "svn_url=$svn_url" >> "$GITHUB_OUTPUT"
          echo "svn_revision=$svn_revision" >> "$GITHUB_OUTPUT"
          echo "signed_tag=$signed_tag" >> "$GITHUB_OUTPUT"
          {
            echo "# Apache ShenYu ${RELEASE_VERSION} ${CANDIDATE}"
            echo
            echo "- Source commit: ${release_sha}"
            echo "- Candidate tag: ${signed_tag:-not requested}"
            echo "- Full CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${{ steps.ci.outputs.run_id }}"
            echo "- Maven staging repository: ${staging_id}"
            echo "- Maven staging URL: ${staging_url}"
            echo "- SVN dev URL: ${svn_url}"
            echo "- SVN commit revision: r${svn_revision}"
            echo
            echo "## Manual community gates"
            echo
            echo "1. Download and verify the Maven staging repository and SVN files."
            echo "2. Send the vote email and wait for the Apache vote."
            echo "3. After the vote passes, release the Maven staging repository in Nexus and move the SVN directory to release/."
            echo "4. Create the final GitHub Release and send the announcement email."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shenyu-${{ inputs.release_version }}-${{ inputs.candidate }}-release-evidence
          path: |
            ${{ runner.temp }}/release-manifest.json
            ${{ runner.temp }}/nexus-staging.log
            ${{ runner.temp }}/svn-import.log
          if-no-files-found: warn
          retention-days: 14
