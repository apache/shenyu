name: ci

on:
  # Required checks must report a result even for documentation-only PRs.
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '**.ico'
      - '**.pdf'
      - '**.doc'
      - '**.docx'
      - 'LICENSE'
      - 'NOTICE'
      - 'DISCLAIMER'
      - '.asf.yaml'
      - '.gitignore'
      - '.licenserc.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE'
      - '**/resources/static/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent_gateway_migrations:
    if: github.repository == 'apache/shenyu'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check Agent Gateway upgrade and schema consistency
        run: |
          python3 .github/scripts/check-agent-gateway-migrations.py
          python3 .github/scripts/test-agent-gateway-migrations.py

  changes:
    if: github.repository == 'apache/shenyu'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.modules.outputs.has_code_changes }}
      code_files: ${{ steps.filter.outputs.code_files }}
      rat_required: ${{ steps.filter.outputs.code }}
      modules: ${{ steps.modules.outputs.modules }}
      full_build_required: ${{ steps.modules.outputs.full_build_required }}
      admin_dialect_required: ${{ steps.filter.outputs.admin_dialect }}
    steps:
      - uses: actions/checkout@v3
      - name: Test CI case resolver
        run: bash .github/scripts/resolve-test-case-matrix-test.sh
      - name: Test storage Compose healthchecks
        run: bash shenyu-e2e/shenyu-e2e-case/shenyu-e2e-case-storage/compose/script/compose-script-test.sh
      - uses: ./actions/paths-filter
        id: filter
        with:
          list-files: "json"
          filters: |
            code:
              - '!**/*.md'
              - '!**/*.txt'
              - '!resources/static/**'
              - '!.asf.yaml'
              - '!.gitignore'
              - '!.licenserc.yaml'
              - '!LICENSE'
              - '!**/LICENSE'
              - '!shenyu-*/**/LICENSE'
              - '!shenyu-*/**/release-docs/LICENSE'
              - '!NOTICE'
              - '!**/NOTICE'
              - '!shenyu-*/**/NOTICE'
              - '!shenyu-*/**/release-docs/NOTICE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/PULL_REQUEST_TEMPLATE'
              - 'shenyu-*/**'
              - 'pom.xml'
              - '**/pom.xml'
              - 'mvnw'
              - 'mvnw.cmd'
              - '.mvn/**'
              - '.github/workflows/**'
              - '.github/scripts/**'
            admin_dialect:
              - 'shenyu-admin/**'
              - 'db/init/mysql/**'
              - 'db/init/pg/**'
              - 'db/init/og/**'
              - 'db/init/ob/**'
              - 'db/init/oracle/**'
              - 'db/upgrade/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/admin-dialect-*'
      - name: Resolve changed Maven modules
        id: modules
        if: steps.filter.outputs.code == 'true'
        env:
          CHANGED_FILES_JSON: ${{ steps.filter.outputs.code_files }}
        run: bash .github/scripts/resolve-ci-modules.sh
      - name: Test GHCR publish routing
        run: bash .github/scripts/resolve-ghcr-publish-test.sh

  rat_check:
    needs: changes
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && needs.changes.outputs.rat_required == 'true'
    steps:
      - uses: actions/checkout@v3
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Run Apache RAT check
        run: ./mvnw -B -ntp apache-rat:check

  pr_build:
    needs: changes
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Debug - Show matched files
        run: |
          echo "Matched files: ${{ needs.changes.outputs.code_files }}"
          echo "Resolved modules: ${{ needs.changes.outputs.modules }}"
          echo "Full build required: ${{ needs.changes.outputs.full_build_required }}"
      - name: Restore ShenYu Maven Repos
        id: restore-maven-cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install mvnd
        shell: bash
        run: |
          MVND_VERSION=1.0.6
          curl -sfL https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip -o mvnd.zip
          unzip -q mvnd.zip
          mkdir -p $HOME/.local
          mv maven-mvnd-${MVND_VERSION}-linux-amd64 $HOME/.local/mvnd
          echo "$HOME/.local/mvnd/bin" >> $GITHUB_PATH
          echo "MVND_HOME=$HOME/.local/mvnd" >> $GITHUB_ENV

      - name: Verify mvnd installation
        shell: bash
        run: mvnd --version || echo "mvnd version check failed, will use maven wrapper as fallback"

      - name: Build with Maven
        shell: bash
        run: |
          MAVEN_ARGS="-B -ntp -T 1C"
          TEST_ARGS="-Prelease -DskipRemoteResources=true -Djacoco.skip=true"
          MODULE_ARGS=""

          if [[ "${{ needs.changes.outputs.full_build_required }}" != "true" && -n "${{ needs.changes.outputs.modules }}" ]]; then
            MODULE_ARGS="-pl ${{ needs.changes.outputs.modules }} -am"
          fi

          if mvnd --version > /dev/null 2>&1; then
            echo "Using mvnd for build"
            mvnd ${MAVEN_ARGS} ${MODULE_ARGS} test ${TEST_ARGS}
          else
            echo "Falling back to maven wrapper"
            ./mvnw ${MAVEN_ARGS} ${MODULE_ARGS} test ${TEST_ARGS}
          fi

  admin_dialect:
    needs: changes
    if: github.repository == 'apache/shenyu' && github.event_name == 'pull_request' && needs.changes.outputs.admin_dialect_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: mysql
            image: mysql:8.0
            port: 3306
            profile: mysql
            url: jdbc:mysql://127.0.0.1:3306/shenyu?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=convertToNull&allowPublicKeyRetrieval=true
            username: root
            password: 12345678
            health_command: mysqladmin ping -h 127.0.0.1 -uroot -p12345678
          - dialect: pg
            image: postgres:14
            port: 5432
            profile: pg
            url: jdbc:postgresql://127.0.0.1:5432/shenyu
            username: postgres
            password: 123456
            health_command: pg_isready -U postgres -d shenyu
          - dialect: og
            image: enmotech/opengauss-lite:5.0.1
            port: 5432
            profile: og
            url: jdbc:opengauss://127.0.0.1:5432/shenyu
            username: gaussdb
            password: ShenYuE2E@123
            health_command: LD_LIBRARY_PATH=/usr/local/opengauss/lib /usr/local/opengauss/bin/gsql -U gaussdb --password ShenYuE2E@123 -h 127.0.0.1 -p 5432 -d shenyu -c 'SELECT 1'
          - dialect: ob
            image: oceanbase/oceanbase-ce:4.4.2-lts
            port: 2881
            profile: ob
            url: jdbc:oceanbase://127.0.0.1:2881/shenyu
            username: root
            password: 12345678
            health_command: obclient -h 127.0.0.1 -P 2881 -uroot -p12345678 -e 'SELECT 1'
          - dialect: oracle
            image: gvenzl/oracle-free:23-slim-faststart
            port: 1521
            profile: oracle
            url: jdbc:oracle:thin:@127.0.0.1:1521/FREEPDB1
            username: shenyu
            password: 12345678
            health_command: healthcheck.sh
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: 12345678
          MYSQL_DATABASE: shenyu
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: shenyu
          GS_PASSWORD: ShenYuE2E@123
          GS_DB: shenyu
          MODE: mini
          OB_SYS_PASSWORD: 12345678
          OB_MEMORY_LIMIT: 4G
          OB_DATAFILE_SIZE: 2G
          OB_LOG_DISK_SIZE: 2G
          OB_SYSTEM_MEMORY: 1G
          OB_TENANT_MEMORY_SIZE: 1G
          OB_TENANT_MINI_CPU: 1
          ORACLE_PASSWORD: 12345678
          APP_USER: shenyu
          APP_USER_PASSWORD: 12345678
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health_command }}"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Restore ShenYu Maven Repos
        id: restore-maven-cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Initialize ${{ matrix.dialect }} schema
        shell: bash
        env:
          DATABASE_ID: ${{ job.services.database.id }}
          DIALECT: ${{ matrix.dialect }}
        run: |
          set -euo pipefail
          case "${DIALECT}" in
            mysql)
              docker exec -i "${DATABASE_ID}" mysql -uroot -p12345678 < db/init/mysql/schema.sql
              ;;
            pg)
              docker exec -i "${DATABASE_ID}" psql -v ON_ERROR_STOP=1 -U postgres -d shenyu < db/init/pg/create-table.sql
              ;;
            og)
              docker exec -i "${DATABASE_ID}" bash -c 'LD_LIBRARY_PATH=/usr/local/opengauss/lib /usr/local/opengauss/bin/gsql -v ON_ERROR_STOP=1 -U gaussdb --password "$GS_PASSWORD" -h 127.0.0.1 -p 5432 -d shenyu' < db/init/og/create-table.sql
              ;;
            ob)
              docker exec -i "${DATABASE_ID}" obclient -h 127.0.0.1 -P 2881 -uroot -p12345678 < db/init/ob/schema.sql
              ;;
            oracle)
              { printf 'WHENEVER SQLERROR EXIT SQL.SQLCODE\n'; cat db/init/oracle/schema.sql; } | docker exec -i "${DATABASE_ID}" sqlplus -s shenyu/12345678@//localhost:1521/FREEPDB1
              ;;
          esac
      - name: Build admin and dependencies
        run: ./mvnw -B -ntp -pl shenyu-admin -am -DskipTests -DskipRemoteResources=true -Djacoco.skip=true -Dmaven.javadoc.skip=true -Drat.skip=true install
      - name: Run admin tests on ${{ matrix.dialect }}
        run: >-
          ./mvnw -B -ntp -pl shenyu-admin
          -Dshenyu.test.database.profile=${{ matrix.profile }}
          -Dspring.datasource.url='${{ matrix.url }}'
          -Dspring.datasource.username=${{ matrix.username }}
          -Dspring.datasource.password=${{ matrix.password }}
          -DskipRemoteResources=true -Djacoco.skip=true test

  build_local_repo:
    needs: changes
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && github.event_name == 'push' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Restore ShenYu Maven Repos
        id: restore-maven-cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Install mvnd
        shell: bash
        run: |
          MVND_VERSION=1.0.6
          curl -sfL https://downloads.apache.org/maven/mvnd/${MVND_VERSION}/maven-mvnd-${MVND_VERSION}-linux-amd64.zip -o mvnd.zip
          unzip -q mvnd.zip
          mkdir -p $HOME/.local
          mv maven-mvnd-${MVND_VERSION}-linux-amd64 $HOME/.local/mvnd
          echo "$HOME/.local/mvnd/bin" >> $GITHUB_PATH
          echo "MVND_HOME=$HOME/.local/mvnd" >> $GITHUB_ENV

      - name: Build ShenYu local Maven repository
        shell: bash
        run: |
          MAVEN_ARGS="-B -ntp -T 1C"
          BUILD_ARGS="-Prelease -DskipTests -DskipRemoteResources=true -Djacoco.skip=true -Dmaven.javadoc.skip=true -Drat.skip=true"

          if mvnd --version > /dev/null 2>&1; then
            echo "Using mvnd for local repository build"
            mvnd ${MAVEN_ARGS} install ${BUILD_ARGS}
          else
            echo "Falling back to maven wrapper"
            ./mvnw ${MAVEN_ARGS} install ${BUILD_ARGS}
          fi

          mkdir -p /tmp/shenyu-m2/org/apache
          cp -R "${HOME}/.m2/repository/org/apache/shenyu" /tmp/shenyu-m2/org/apache/shenyu
      - name: Upload ShenYu local Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: shenyu-local-maven-repository
          path: /tmp/shenyu-m2
          retention-days: 1

  test_group:
    needs:
      - changes
      - build_local_repo
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && github.event_name == 'push' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            modules: shenyu-common,shenyu-spi,shenyu-disruptor,shenyu-protocol,shenyu-loadbalancer
          - name: gateway
            modules: shenyu-web,shenyu-bootstrap,shenyu-spring-boot-starter
          - name: admin-sync
            modules: shenyu-admin,shenyu-admin-listener,shenyu-sync-data-center
          - name: plugin
            modules: shenyu-plugin
          - name: client-register-registry
            modules: shenyu-client,shenyu-register-center,shenyu-registry
          - name: dist-extra
            modules: shenyu-dist,shenyu-sdk,shenyu-alert,shenyu-kubernetes-controller,shenyu-infra
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Restore ShenYu Maven Repos
        id: restore-maven-cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
      - uses: actions/download-artifact@v4
        with:
          name: shenyu-local-maven-repository
          path: /tmp/shenyu-m2
      - name: Restore ShenYu local Maven repository
        run: bash .github/scripts/restore-shenyu-local-repo.sh /tmp/shenyu-m2
      - name: Run Maven tests
        shell: bash
        run: |
          modules="$(GROUP_ROOTS="${{ matrix.modules }}" bash .github/scripts/expand-ci-module-roots.sh)"
          echo "Testing Maven modules: ${modules}"
          ./mvnw -B -ntp -T 1C -pl "${modules}" test -Prelease -DskipRemoteResources=true
      - uses: codecov/codecov-action@v1
        with:
          token: 2760af6a-3405-4882-9e61-04c5176fecfa
          flags: ${{ matrix.name }}

  compat_java21:
    needs:
      - changes
      - build_local_repo
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && github.event_name == 'push' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Restore ShenYu Maven Repos
        id: restore-maven-cache
        uses: actions/cache/restore@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: actions/download-artifact@v4
        with:
          name: shenyu-local-maven-repository
          path: /tmp/shenyu-m2
      - name: Restore ShenYu local Maven repository
        run: bash .github/scripts/restore-shenyu-local-repo.sh /tmp/shenyu-m2
      - name: Run Java 21 compatibility tests
        shell: bash
        run: |
          ./mvnw -B -ntp -T 1C test -Prelease -DskipRemoteResources=true -Djacoco.skip=true

  check-license-header:
    name: check-license-header
    if: (github.repository == 'apache/shenyu')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Check License Header
        uses: apache/skywalking-eyes@9bd5feb86b5817aa6072b008f9866a2c3bbc8587
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  requirement:
    name: build
    if: (github.repository == 'apache/shenyu') && always()
    needs:
      - changes
      - rat_check
      - pr_build
      - build_local_repo
      - test_group
      - compat_java21
      - admin_dialect
    runs-on: ubuntu-latest
    steps:
      - name: checking job status
        run: |
          [[ "${{ needs.changes.result }}" == "success" ]] || exit -1
          if [[ "${{ needs.changes.outputs.rat_required }}" == "true" ]]; then
            [[ "${{ needs.rat_check.result }}" == "success" ]] || exit -1
          fi
          if [[ "${{ needs.changes.outputs.code }}" == "true" && "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "${{ needs.pr_build.result }}" == "success" ]] || exit -1
          fi
          if [[ "${{ needs.changes.outputs.admin_dialect_required }}" == "true" && "${{ github.event_name }}" == "pull_request" ]]; then
            [[ "${{ needs.admin_dialect.result }}" == "success" ]] || exit -1
          fi
          if [[ "${{ needs.changes.outputs.code }}" == "true" && "${{ github.event_name }}" == "push" ]]; then
            [[ "${{ needs.build_local_repo.result }}" == "success" ]] || exit -1
            [[ "${{ needs.test_group.result }}" == "success" ]] || exit -1
            [[ "${{ needs.compat_java21.result }}" == "success" ]] || exit -1
          fi
