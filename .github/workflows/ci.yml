name: ci

on:
  workflow_dispatch:
  # Required checks must report a result even for documentation-only PRs.
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '**/README*.md'
      - 'docs/**'
      - '**/docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  # Give every non-PR run its own group, including runs still waiting for a runner.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent_gateway_migrations:
    needs: changes
    if: github.repository == 'apache/shenyu' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Agent Gateway upgrade and schema consistency
        run: |
          python3 .github/scripts/check-agent-gateway-migrations.py
          python3 .github/scripts/test-agent-gateway-migrations.py

  changes:
    if: github.repository == 'apache/shenyu'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.modules.outputs.has_code_changes }}
      code_files: ${{ steps.filter.outputs.code_files }}
      rat_required: ${{ steps.filter.outputs.code }}
      modules: ${{ steps.modules.outputs.modules }}
      full_build_required: ${{ steps.modules.outputs.full_build_required }}
    steps:
      - uses: actions/checkout@v4
      - name: Test workflow scope and example image selection
        run: |
          node --test .github/scripts/test-ci-workflows.mjs
          python3 -B .github/scripts/test-resolve-example-projects.py
          python3 -B .github/scripts/test-actions-timings.py
          python3 -B .github/scripts/test-restore-shenyu-local-repo.py
      - name: Test CI case resolver
        run: bash .github/scripts/resolve-test-case-matrix-test.sh
      - name: Test HTTP pool snapshot source provenance
        run: python3 script/performance/http-pool/test_snapshot.py
      - name: Test HTTP pool benchmark report integrity
        run: python3 script/performance/http-pool/test_report.py
      - name: Test Maven transfer retries
        run: bash .github/scripts/maven-with-retry-test.sh
      - name: Test storage Compose healthchecks
        run: bash shenyu-e2e/shenyu-e2e-case/shenyu-e2e-case-storage/compose/script/compose-script-test.sh
      - name: Test E2E artifact reruns
        run: node --test .github/scripts/retest-test.mjs
      - uses: ./actions/paths-filter
        id: filter
        with:
          list-files: "json"
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!.asf.yaml'
              - '!.gitignore'
              - '!.licenserc.yaml'
              - '!LICENSE'
              - '!**/LICENSE'
              - '!shenyu-*/**/LICENSE'
              - '!shenyu-*/**/release-docs/LICENSE'
              - '!NOTICE'
              - '!**/NOTICE'
              - '!shenyu-*/**/NOTICE'
              - '!shenyu-*/**/release-docs/NOTICE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!*.md'
              - '!**/README*.md'
              - '!docs/**'
              - '!**/docs/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
      - name: Resolve changed Maven modules
        id: modules
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CHANGED_FILES_JSON: ${{ github.event_name == 'workflow_dispatch' && '["pom.xml"]' || steps.filter.outputs.code_files }}
        run: bash .github/scripts/resolve-ci-modules.sh
      - name: Test GHCR publish routing
        run: bash .github/scripts/resolve-ghcr-publish-test.sh

  registry_dependencies:
    needs: changes
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Replay registration contract and check resolved client boundaries
        run: |
          python3 .github/scripts/test-client-boundary.py
          python3 .github/scripts/check-client-boundary.py
          ./mvnw -B -ntp -pl shenyu-admin,shenyu-spring-boot-starter/shenyu-spring-boot-starter-client/shenyu-spring-boot-starter-client-beat -am package dependency:tree \
            -Dtest=RegistrationProtocolCompatibilityTest,ZookeeperClientDiscoveryIntegrationTest,HeartbeatListenerConfigurationTest \
            -Dsurefire.failIfNoSpecifiedTests=false -DskipRemoteResources=true -Djacoco.skip=true -Dmaven.javadoc.skip=true \
            -Dscope=test -DoutputType=tgf -DoutputFile=target/client-boundary.tgf
          python3 .github/scripts/check-client-boundary.py --trees
      - name: Check resolved registry dependency boundaries
        run: |
          python3 .github/scripts/test-registry-dependencies.py
          REGISTRY_MODULES="$(python3 .github/scripts/check-registry-dependencies.py --modules)"
          ./mvnw -B -ntp -pl "$REGISTRY_MODULES" -am package dependency:tree \
            -DskipTests -DskipRemoteResources=true -Djacoco.skip=true -Dmaven.javadoc.skip=true \
            -Dscope=runtime -DoutputType=tgf -DoutputFile=target/registry-dependencies.tgf
          python3 .github/scripts/check-registry-dependencies.py

  rat_check:
    needs: changes
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && (needs.changes.outputs.rat_required == 'true' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Run Apache RAT check
        run: ./mvnw -B -ntp apache-rat:check

  pr_build:
    needs: changes
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' && needs.changes.outputs.full_build_required != 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        shell: bash
        env:
          MODULES: ${{ needs.changes.outputs.modules }}
        run: |
          module_args=()
          if [[ -n "$MODULES" ]]; then
            module_args=(-pl "$MODULES" -am)
          fi
          exec bash .github/scripts/maven-with-retry.sh ./mvnw -B -ntp -T 1C "${module_args[@]}" test \
            -Prelease -DskipRemoteResources=true -Djacoco.skip=true

  build_local_repo:
    needs: changes
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && (github.event_name != 'pull_request' || needs.changes.outputs.full_build_required == 'true') && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build ShenYu local Maven repository
        shell: bash
        run: |
          ./mvnw -B -ntp -T 1C install -Prelease -DskipTests -DskipRemoteResources=true \
            -Djacoco.skip=true -Dmaven.javadoc.skip=true -Drat.skip=true

          mkdir -p /tmp/shenyu-m2
          tar -czf /tmp/shenyu-m2/repository.tar.gz -C "${HOME}/.m2/repository" org/apache/shenyu
      - name: Upload ShenYu local Maven repository
        uses: actions/upload-artifact@v4
        with:
          name: shenyu-local-maven-repository
          path: /tmp/shenyu-m2/repository.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  test_group:
    needs:
      - changes
      - build_local_repo
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && (github.event_name != 'pull_request' || needs.changes.outputs.full_build_required == 'true') && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            modules: shenyu-common,shenyu-spi,shenyu-disruptor,shenyu-protocol,shenyu-loadbalancer
          - name: gateway-runtime
            modules: shenyu-web,shenyu-bootstrap
          - name: starters
            modules: shenyu-spring-boot-starter,!shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-agent-gateway
          - name: starters-agent
            modules: shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-agent-gateway
          - name: admin
            modules: shenyu-admin
          - name: sync
            modules: shenyu-admin-listener,shenyu-sync-data-center
          - name: plugin-base
            modules: shenyu-plugin/shenyu-plugin-api,shenyu-plugin/shenyu-plugin-wasm-api,shenyu-plugin/shenyu-plugin-base,shenyu-plugin/shenyu-plugin-wasm-base,shenyu-plugin/shenyu-plugin-httpclient,shenyu-plugin/shenyu-plugin-rewrite,shenyu-plugin/shenyu-plugin-waf,shenyu-plugin/shenyu-plugin-global,shenyu-plugin/shenyu-plugin-context-path,shenyu-plugin/shenyu-plugin-redirect,shenyu-plugin/shenyu-plugin-modify-response,shenyu-plugin/shenyu-plugin-request,shenyu-plugin/shenyu-plugin-response,shenyu-plugin/shenyu-plugin-param-mapping,shenyu-plugin/shenyu-plugin-uri,shenyu-plugin/shenyu-plugin-metrics,shenyu-plugin/shenyu-plugin-tracing,shenyu-plugin/shenyu-plugin-cache,shenyu-plugin/shenyu-plugin-mock
          - name: plugin-logging
            modules: shenyu-plugin/shenyu-plugin-logging
          - name: plugin-proxy
            modules: shenyu-plugin/shenyu-plugin-proxy,shenyu-plugin/shenyu-plugin-security,shenyu-plugin/shenyu-plugin-fault-tolerance
          - name: plugin-ai
            modules: shenyu-plugin/shenyu-plugin-ai,shenyu-plugin/shenyu-plugin-agent-gateway,shenyu-plugin/shenyu-plugin-mcp-server
          - name: client-register-registry
            modules: shenyu-client,shenyu-register-center,shenyu-registry
          - name: dist-extra
            modules: shenyu-dist,shenyu-sdk,shenyu-alert,shenyu-kubernetes-controller,shenyu-infra
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: shenyu-local-maven-repository
          path: /tmp/shenyu-m2
      - name: Restore ShenYu local Maven repository
        run: bash .github/scripts/restore-shenyu-local-repo.sh /tmp/shenyu-m2
      # The producer already checks main and test source style for the complete reactor.
      - name: Run Maven tests
        shell: bash
        run: |
          modules="$(GROUP_ROOTS="${{ matrix.modules }}" bash .github/scripts/expand-ci-module-roots.sh)"
          echo "Testing Maven modules: ${modules}"
          ./mvnw -B -ntp -T 1C -pl "${modules}" test -Prelease -DskipRemoteResources=true -Dcheckstyle.skip=true
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.name }}

  compat_java21:
    needs:
      - changes
      - build_local_repo
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && (github.event_name != 'pull_request' || needs.changes.outputs.full_build_required == 'true') && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            modules: shenyu-common,shenyu-spi,shenyu-disruptor,shenyu-protocol,shenyu-loadbalancer
          - name: gateway-runtime
            modules: shenyu-web,shenyu-bootstrap
          - name: starters
            modules: shenyu-spring-boot-starter,!shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-agent-gateway
          - name: starters-agent
            modules: shenyu-spring-boot-starter/shenyu-spring-boot-starter-plugin/shenyu-spring-boot-starter-plugin-agent-gateway
          - name: admin
            modules: shenyu-admin
          - name: sync
            modules: shenyu-admin-listener,shenyu-sync-data-center
          - name: plugin-base
            modules: shenyu-plugin/shenyu-plugin-api,shenyu-plugin/shenyu-plugin-wasm-api,shenyu-plugin/shenyu-plugin-base,shenyu-plugin/shenyu-plugin-wasm-base,shenyu-plugin/shenyu-plugin-httpclient,shenyu-plugin/shenyu-plugin-rewrite,shenyu-plugin/shenyu-plugin-waf,shenyu-plugin/shenyu-plugin-global,shenyu-plugin/shenyu-plugin-context-path,shenyu-plugin/shenyu-plugin-redirect,shenyu-plugin/shenyu-plugin-modify-response,shenyu-plugin/shenyu-plugin-request,shenyu-plugin/shenyu-plugin-response,shenyu-plugin/shenyu-plugin-param-mapping,shenyu-plugin/shenyu-plugin-uri,shenyu-plugin/shenyu-plugin-metrics,shenyu-plugin/shenyu-plugin-tracing,shenyu-plugin/shenyu-plugin-cache,shenyu-plugin/shenyu-plugin-mock
          - name: plugin-logging
            modules: shenyu-plugin/shenyu-plugin-logging
          - name: plugin-proxy
            modules: shenyu-plugin/shenyu-plugin-proxy,shenyu-plugin/shenyu-plugin-security,shenyu-plugin/shenyu-plugin-fault-tolerance
          - name: plugin-ai
            modules: shenyu-plugin/shenyu-plugin-ai,shenyu-plugin/shenyu-plugin-agent-gateway,shenyu-plugin/shenyu-plugin-mcp-server
          - name: client-register-registry
            modules: shenyu-client,shenyu-register-center,shenyu-registry
          - name: dist-extra
            modules: shenyu-dist,shenyu-sdk,shenyu-alert,shenyu-kubernetes-controller,shenyu-infra
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./actions/setup-java-with-retry
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - uses: actions/download-artifact@v4
        with:
          name: shenyu-local-maven-repository
          path: /tmp/shenyu-m2
      - name: Restore ShenYu local Maven repository
        run: bash .github/scripts/restore-shenyu-local-repo.sh /tmp/shenyu-m2
      # Reuse the producer's Checkstyle result; preserve all Java 21 test execution.
      - name: Run Java 21 compatibility tests
        shell: bash
        run: |
          modules="$(GROUP_ROOTS="${{ matrix.modules }}" bash .github/scripts/expand-ci-module-roots.sh)"
          ./mvnw -B -ntp -T 1C -pl "${modules}" test -Prelease -DskipRemoteResources=true -Dcheckstyle.skip=true -Djacoco.skip=true

  check-license-header:
    name: check-license-header
    needs: changes
    if: github.repository == 'apache/shenyu' && (needs.changes.outputs.rat_required == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Check License Header
        uses: apache/skywalking-eyes@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0; supports REM headers in Windows batch files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  requirement:
    name: build
    if: github.repository == 'apache/shenyu' && !cancelled()
    needs:
      - changes
      - rat_check
      - agent_gateway_migrations
      - registry_dependencies
      - check-license-header
      - pr_build
      - build_local_repo
      - test_group
      - compat_java21
    runs-on: ubuntu-latest
    steps:
      - name: checking job status
        run: |
          [[ "${{ needs.changes.result }}" == "success" ]] || exit 1
          if [[ "${{ needs.changes.outputs.code }}" == "true" ]]; then
            [[ "${{ needs.registry_dependencies.result }}" == "success" ]] || exit 1
            [[ "${{ needs.agent_gateway_migrations.result }}" == "success" ]] || exit 1
          fi
          if [[ "${{ needs.changes.outputs.rat_required }}" == "true" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "${{ needs.rat_check.result }}" == "success" ]] || exit 1
            [[ "${{ needs.check-license-header.result }}" == "success" ]] || exit 1
          fi
          if [[ "${{ needs.changes.outputs.code }}" == "true" && "${{ github.event_name }}" == "pull_request" && "${{ needs.changes.outputs.full_build_required }}" != "true" ]]; then
            [[ "${{ needs.pr_build.result }}" == "success" ]] || exit 1
          fi
          if [[ "${{ needs.changes.outputs.code }}" == "true" && ("${{ github.event_name }}" != "pull_request" || "${{ needs.changes.outputs.full_build_required }}" == "true") ]]; then
            [[ "${{ needs.build_local_repo.result }}" == "success" ]] || exit 1
            [[ "${{ needs.test_group.result }}" == "success" ]] || exit 1
            [[ "${{ needs.compat_java21.result }}" == "success" ]] || exit 1
          fi
