name: LGTM

# Post /lgtm as the entire comment on an open PR to submit an approving review.
# The Actions bot reviews the current head commit. A rocket confirms success.
# Repository settings must allow GitHub Actions to create and approve pull requests.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  lgtm:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/lgtm')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: lgtm-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      # Use the default-branch script without checking out or executing PR code.
      - name: Approve pull request
        uses: actions/github-script@v7
        with:
          script: |
            const {issue, comment, action} = context.payload;
            if (action !== 'created' || !issue?.pull_request || comment?.body?.trim() !== '/lgtm') {
                return;
            }

            const repo = context.repo;
            const {data: pr} = await github.rest.pulls.get({...repo, pull_number: issue.number});
            if (pr.state !== 'open') {
                core.info('Skipping a closed pull request.');
                return;
            }

            await github.rest.pulls.createReview({
                ...repo,
                pull_number: issue.number,
                commit_id: pr.head.sha,
                event: 'APPROVE',
                body: `Approved via /lgtm by @${comment.user.login}.`,
            });
            await github.rest.reactions.createForIssueComment({
                ...repo,
                comment_id: comment.id,
                content: 'rocket',
            });
