name: it-k8s

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - '**/README*.md'
      - 'docs/**'
      - '**/docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  # Give every non-PR run its own group, including runs still waiting for a runner.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.repository == 'apache/shenyu'
    runs-on: ubuntu-latest
    outputs:
      k8s_ingress: ${{ steps.cases.outputs.run_k8s_ingress }}
      k8s_ingress_matrix: ${{ steps.cases.outputs.k8s_ingress_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/paths-filter
        id: filter
        with:
          list-files: "json"
          predicate-quantifier: every
          filters: |
            k8s-ingress:
              - '{shenyu-integrated-test-k8s-ingress*/**,shenyu-*/**,pom.xml,**/pom.xml,shenyu-examples/**,.github/workflows/integrated-test-k8s-ingress.yml,.github/scripts/resolve-test-case-matrix.sh,.github/scripts/resolve-test-case-matrix-test.sh,.github/scripts/**,actions/**,mvnw,mvnw.cmd,.mvn/**}'
              - '!.asf.yaml'
              - '!.gitignore'
              - '!.licenserc.yaml'
              - '!LICENSE'
              - '!NOTICE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!*.md'
              - '!**/README*.md'
              - '!docs/**'
              - '!**/docs/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'
      - name: Resolve k8s ingress cases
        id: cases
        if: steps.filter.outputs['k8s-ingress'] == 'true'
        env:
          CHANGED_FILES_JSON: ${{ steps.filter.outputs['k8s-ingress_files'] }}
          CI_CASE_MODE: k8s-ingress
        run: bash .github/scripts/resolve-test-case-matrix.sh

  build:
    needs: changes
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.k8s_ingress_matrix || '{"include":[]}') }}
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu' && needs.changes.outputs.k8s_ingress == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Clean Space
        run: bash .github/scripts/free-disk-space.sh

      - uses: ./actions/setup-java-with-retry
        with:
          java-version: 17
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: |
            **/pom.xml

      - name: Test Dubbo deployment readiness script
        if: matrix.case == 'shenyu-integrated-test-k8s-ingress-apache-dubbo'
        run: bash ./shenyu-integrated-test/shenyu-integrated-test-k8s-ingress-apache-dubbo/script/build_k8s_cluster_test.sh

      - name: Test HTTP fixture image and deployment script
        if: matrix.case == 'shenyu-integrated-test-k8s-ingress-http'
        run: bash ./shenyu-integrated-test/shenyu-integrated-test-k8s-ingress-http/script/build_k8s_cluster_test.sh

      - name: Install k8s
        run: |
          curl --fail --location https://github.com/kubernetes-sigs/kind/releases/download/v0.14.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
          curl -LO https://storage.googleapis.com/kubernetes-release/release/v1.24.14/bin/linux/amd64/kubectl && sudo install kubectl /usr/local/bin/kubectl
          kind create cluster --image=kindest/node:v1.21.1 --config=./shenyu-integrated-test/${{ matrix.case }}/deploy/kind-config.yaml

      - name: Build with Maven
        shell: bash
        run: |
          ./mvnw -B -T 1C clean install -Dmaven.javadoc.skip=true -Dmaven.test.skip=true

      - name: Build integrated tests
        shell: bash
        run: |
          ./mvnw -B -T 1C clean install -Pit -DskipTests -pl :${{ matrix.case }} -am -f ./shenyu-integrated-test/pom.xml

      - name: Resolve required example projects
        id: examples
        env:
          INTEGRATION_CASE: ${{ matrix.case }}
        run: echo "projects=$(python3 .github/scripts/resolve-example-projects.py "$INTEGRATION_CASE")" >> "$GITHUB_OUTPUT"

      - name: Build examples
        shell: bash
        run: |
          ./mvnw -B -T 1C clean install -Pexample -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -pl "${{ steps.examples.outputs.projects }}" -am -f ./shenyu-examples/pom.xml

      - name: Build k8s Cluster
        run: bash ./shenyu-integrated-test/${{ matrix.case }}/script/build_k8s_cluster.sh

      - name: Wait for k8s Cluster Start up
        id: healthcheck
        timeout-minutes: 25
        run: |
          bash ./shenyu-integrated-test/${{ matrix.case }}/script/healthcheck.sh

      - name: Run test
        id: test
        shell: bash
        run: |
          ./mvnw -T 1C test -Pit -f ./shenyu-integrated-test/${{ matrix.case }}/pom.xml
        continue-on-error: true

      - name: Cluster Test after Healthcheck
        if: always()
        run: |
          echo "----------kubectl get all -o wide----------"
          kubectl get all -o wide || true
          echo "----------kubectl get all -n shenyu-ingress -o wide----------"
          kubectl get all -n shenyu-ingress -o wide || true
          echo "----------kubectl get events --all-namespaces----------"
          kubectl get events --all-namespaces || true
          echo "----------kubectl describe pod -n shenyu-ingress----------"
          kubectl describe pod -n shenyu-ingress || true
          echo "----------kubectl logs -l app=shenyu-ingress-controller -n shenyu-ingress --tail=-1----------"
          kubectl logs -l app=shenyu-ingress-controller -n shenyu-ingress --tail=-1 || true
          if [[ ${{steps.healthcheck.outcome}} == "failure" ]]; then
            echo "Healthcheck Failed"
            exit 1
          elif [[ ${{steps.test.outcome}} == "failure" ]]; then
            echo "Test Failed"
            exit 1
          else
            echo "Test Successful"
            exit 0
          fi
