name: it-k8s-gateway-api

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      matrix:
        case:
          - shenyu-integrated-test-k8s-gateway-api-http
    runs-on: ubuntu-latest
    if: github.repository == 'apache/shenyu'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./actions/paths-filter
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            k8s-gateway-api:
              - '{shenyu-integrated-test-k8s-gateway-api*/**,shenyu-*/**,pom.xml,**/pom.xml,shenyu-examples/**,.github/workflows/integrated-test-k8s-gateway-api.yml,.github/scripts/**,actions/**,mvnw,mvnw.cmd,.mvn/**}'
              - '!.asf.yaml'
              - '!.gitignore'
              - '!.licenserc.yaml'
              - '!LICENSE'
              - '!NOTICE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!*.md'
              - '!**/README*.md'
              - '!docs/**'
              - '!**/docs/**'
              - '!.github/PULL_REQUEST_TEMPLATE.md'

      - name: Clean Space
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        run: bash .github/scripts/free-disk-space.sh

      - uses: actions/setup-java@v4
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        with:
          java-version: 17
          distribution: "temurin"
          cache: maven

      - name: Install k8s
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        run: |
          curl --fail --location https://github.com/kubernetes-sigs/kind/releases/download/v0.24.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          sudo install "$RUNNER_TEMP/kind" /usr/local/bin/kind
          curl -LO https://storage.googleapis.com/kubernetes-release/release/v1.31.0/bin/linux/amd64/kubectl && sudo install kubectl /usr/local/bin/kubectl
          kind create cluster --image=kindest/node:v1.31.0 --config=./shenyu-integrated-test/${{ matrix.case }}/deploy/kind-config.yaml

      - name: Build with Maven
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        shell: bash
        run: |
          ./mvnw -B -ntp -T 1C clean install -Dmaven.javadoc.skip=true -Dmaven.test.skip=true

      - name: Build integrated tests
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        shell: bash
        run: |
          ./mvnw -B -ntp -T 1C clean install -Pit -DskipTests -pl :${{ matrix.case }} -am -f ./shenyu-integrated-test/pom.xml

      - name: Resolve required example projects
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        id: examples
        env:
          INTEGRATION_CASE: ${{ matrix.case }}
        run: echo "projects=$(python3 .github/scripts/resolve-example-projects.py "$INTEGRATION_CASE")" >> "$GITHUB_OUTPUT"

      - name: Build examples
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        shell: bash
        run: |
          ./mvnw -B -ntp -T 1C clean install -Pexample -Dmaven.javadoc.skip=true -Dmaven.test.skip=true -pl "${{ steps.examples.outputs.projects }}" -am -f ./shenyu-examples/pom.xml

      - name: Build k8s Cluster
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        run: bash ./shenyu-integrated-test/${{ matrix.case }}/script/build_k8s_cluster.sh

      - name: Wait for k8s Cluster Start up
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        timeout-minutes: 15
        run: |
          bash ./shenyu-integrated-test/${{ matrix.case }}/script/healthcheck.sh

      - name: Run test
        id: test
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        shell: bash
        run: |
          ./mvnw test -Pit -f ./shenyu-integrated-test/${{ matrix.case }}/pom.xml
        continue-on-error: true

      - name: Cluster Test after Healthcheck
        if: steps.filter.outputs.k8s-gateway-api == 'true'
        run: |
          echo "----------kubectl get all -o wide----------"
          kubectl get all -o wide
          echo "----------kubectl get all -n shenyu-gateway-api -o wide----------"
          kubectl get all -n shenyu-gateway-api -o wide
          echo "----------kubectl get events --all-namespaces----------"
          kubectl get events --all-namespaces
          echo "----------kubectl logs -l app=shenyu-gateway-api-controller -n shenyu-gateway-api --tail=-1----------"
          kubectl logs -l app=shenyu-gateway-api-controller -n shenyu-gateway-api --tail=-1
          if [[ ${{steps.test.outcome}} == "failure" ]]; then
            echo "Test Failed"
            exit 1
          else
            echo "Test Successful"
            exit 0
          fi
