# Minimal HTTP gateway configuration (issue #7649).
# Only what the divide HTTP proxy + websocket sync channel needs;
# everything else relies on ShenYu built-in defaults.

server:
  port: 9195
  address: 0.0.0.0

spring:
  application:
    name: shenyu-bootstrap-http
  codec:
    max-in-memory-size: 2MB

management:
  endpoint:
    health:
      enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include:
          - 'health'
          - 'info'

shenyu:
  # namespace intentionally unset: the code default (Constants.SYS_DEFAULT_NAMESPACE_ID)
  # already matches the default seeded namespace of shenyu-admin.
  # Set shenyu.namespace only when the admin uses a non-default namespace.
  switchConfig:
    local: true
    collapseSlashes: false
  file:
    enabled: true
    maxSize: 10
  # CORS is disabled by default: a gateway must not ship with cross-origin
  # access open to every website (PR #7709 review).
  # To enable CORS deliberately, set enabled: true and configure an explicit
  # origin allow-list, e.g.:
  #   cross:
  #     enabled: true
  #     allowedOrigin:
  #       origins:
  #         - https://example.com
  #     allowedMethods: "*"
  #     allowedHeaders:
  #     maxAge: "18000"
  #     allowCredentials: true
  # WARNING: never combine allowedAnyOrigin: true with allowCredentials: true,
  # otherwise any website could issue credentialed cross-origin requests through
  # this gateway. This high-risk combination must never be a default.
  cross:
    enabled: false
  # the single data-sync channel: websocket (matches shenyu-admin default)
  sync:
    websocket:
      urls: ${SHENYU_SYNC_WEBSOCKET_URLS:ws://localhost:9095/websocket}
      token: ${SHENYU_SYNC_WEBSOCKET_TOKEN:}
      allowOrigin: ${SHENYU_SYNC_WEBSOCKET_ALLOW_ORIGIN:ws://localhost:9195}
  health:
    enabled: true
    paths:
      - /actuator
      - /health_check

logging:
  level:
    root: info
    org.springframework.boot: info
    org.apache.shenyu: info
